<style>
:root{color-scheme:light;--navy:#172b52;--blue:#355fba;--bg:#f2f5fb;--text:#1c2944;--green:#147b55;--red:#cc4450;--gold:#eaa943}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--text)}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}header{background:var(--navy);color:white;padding:14px max(18px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px}header strong{font-size:clamp(18px,2.5vw,26px)}header small{opacity:.73}.shell{max-width:1250px;margin:auto;padding:clamp(12px,2vw,25px)}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar label{font-weight:750}.toolbar select,.toolbar button{border:1px solid #ccd6e7;border-radius:12px;background:white;padding:11px 13px;color:var(--text);min-height:46px}.toolbar select{max-width:100%;flex:1;min-width:170px}.toolbar .chip[aria-pressed="true"]{color:white;background:var(--blue)}.spacer{flex:1}.stage{background:white;border:2px solid #e0e7f2;box-shadow:0 12px 40px #24376112;border-radius:24px;min-height:clamp(340px,58vh,600px);padding:clamp(22px,4vw,50px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;text-align:center}.eyebrow{color:#4f68a0;font-weight:800;font-size:clamp(19px,2.3vw,29px)}.instruction{font-size:clamp(16px,2vw,23px);color:#65718a}.instruction-en{font-family:Arial,sans-serif;font-size:clamp(18px,2.1vw,25px);color:#395b91;font-weight:650;line-height:1.35;margin-top:-12px}.sentence{font-family:"BiauKai","DFKai-SB","KaiTi","STKaiti","Noto Serif TC",serif;font-size:clamp(36px,5.9vw,88px);line-height:1.52;font-weight:700;letter-spacing:.02em;overflow-wrap:anywhere;max-width:100%}.stage.revealed .sentence .wrong{color:var(--red);background:#ffe6e8;border-radius:.12em;padding:0 .05em}.sentence .blank{color:#cc5765}.sentence .change{color:var(--blue);text-decoration:underline;text-underline-offset:.17em}.number-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.5vw,26px);width:min(850px,100%)}.number-tile{background:#f2f5fb;border:2px solid #dbe5f6;border-radius:20px;padding:clamp(12px,2.8vw,30px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:clamp(115px,21vh,210px)}.number-value{font-family:Arial,sans-serif;font-size:clamp(55px,9.5vw,126px);font-weight:850;line-height:1.1;font-variant-numeric:tabular-nums}.number-reading{font-size:clamp(24px,3.6vw,48px);line-height:1.35;color:var(--green);font-weight:800}.number-grid:not(.revealed) .number-reading{display:none}@media(max-width:600px){.number-grid{gap:10px}.number-tile{min-height:120px;padding:10px}.number-value{font-size:clamp(49px,13vw,77px)}.number-reading{font-size:clamp(23px,6vw,34px)}}.answer{width:100%;border-top:2px dashed #dfe7f0;padding-top:18px;display:flex;flex-direction:column;align-items:center;gap:12px}.answer .label{color:var(--green);font-weight:800;font-size:clamp(18px,2.2vw,26px)}.answer .correct{font-family:"BiauKai","DFKai-SB","KaiTi","STKaiti","Noto Serif TC",serif;color:var(--green);font-weight:750;font-size:clamp(27px,3.65vw,54px);line-height:1.4}.answer .detail{font-size:clamp(17px,2vw,25px);line-height:1.5}.pinyin{font-family:Arial,sans-serif;color:#66738d;font-size:clamp(16px,1.7vw,23px);line-height:1.6}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.controls button{border:0;border-radius:16px;min-height:74px;padding:12px 16px;font-weight:850;font-size:clamp(20px,2.3vw,29px)}.reveal{background:#e0e9fc;color:#224a91}.next{background:#2658ae;color:white}.controls button:active{transform:scale(.985)}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;color:#64728c;font-size:13px}.foot button{background:transparent;border:0;color:#315a9f;text-decoration:underline}.foot button:disabled{opacity:.35}.hint{background:#fff8e8;color:#805922;border:1px solid #f5dfac;border-radius:10px;padding:8px 12px;max-width:830px;font-size:14px}.hidden{display:none!important}#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#162d53;color:white;padding:9px 16px;border-radius:15px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}@media(max-width:600px){header small{font-size:11px}header strong{font-size:18px}.shell{padding:10px}.toolbar{gap:7px}.toolbar label{font-size:14px}.toolbar select{min-width:125px}.toolbar button{padding:8px}.stage{min-height:52svh;border-radius:16px;padding:18px 13px;gap:16px}.sentence{font-size:clamp(39px,9vw,58px)}.controls button{min-height:65px;font-size:20px}.instruction{font-size:16px}.instruction-en{font-size:16px;margin-top:-9px}.foot{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<body>
<header><strong>🌟 CSL2 中文句子挑戰</strong><small>第一、二課 · v1.1.1</small><a href="../../" style="color:white;font-size:15px;text-decoration:underline;text-underline-offset:4px">← 返回遊戲首頁</a></header>
<main class="shell">
 <div class="toolbar">
  <label for="mode">題型</label><select id="mode" aria-label="選擇題型"><option value="all">🎲 七種混合</option><option value="missing">消失的字</option><option value="intruder">搗蛋的字</option><option value="scramble">句子大風吹</option><option value="repair">句子修理工</option><option value="qa">神祕問答</option><option value="magic">句子變魔術</option><option value="numbers">🔢 數字朗讀</option></select>
  <button id="pinyin" class="chip" aria-pressed="false">拼音：關</button><button id="fullscreen" class="chip">⛶ 全螢幕</button>
 </div>
 <section class="stage" aria-live="polite">
  <div id="kind" class="eyebrow"></div><div id="instruction" class="instruction"></div><div id="instructionEn" class="instruction-en" lang="en"></div>
  <div id="prompt" class="sentence"></div><div id="questionPinyin" class="pinyin hidden"></div>
  <div id="answer" class="answer hidden"><div class="label">✨ 答案揭曉</div><div id="explain" class="detail"></div><div id="correct" class="correct"></div><div id="answerPinyin" class="pinyin hidden"></div></div>
 </section>
 <div class="controls"><button class="reveal" id="reveal">👀 顯示答案</button><button class="next" id="next">🎲 下一題</button></div>
 <div class="foot"><span id="progress">準備開始</span><button id="back" disabled>↶ 上一題</button><button id="reset">重新洗牌</button><span>老師操作 · 學生口頭回答 · 無計分</span></div>
 <p class="hint">💡「句子大風吹」請學生說出正確順序；「句子變魔術」要依指令把指定字詞換掉。拼音為輔助功能，預設不顯示；「數字朗讀」每題會隨機顯示四個 11–99 的數字，按顯示答案後才出現中文讀法。</p>
</main><div id="toast" role="status"></div>
<script>
'use strict';
// 以手動核對的題目為主，避免隨機挖空導致一題多解或不自然的中文。
const Q = [
// Missing: 9
['missing','你 □，我的名字叫小明。','你____，我的名字叫小明。','好','你好，我的名字叫小明。','Nǐ hǎo, wǒ de míngzi jiào Xiǎomíng.'],
['missing','我的 □□ 叫小美。','我的____叫小美。','名字','我的名字叫小美。','Wǒ de míngzi jiào Xiǎoměi.'],
['missing','你叫什麼 □□？','你叫什麼____？','名字','你叫什麼名字？','Nǐ jiào shénme míngzi?'],
['missing','你家有 □ 個人？','你家有____個人？','幾','你家有幾個人？','Nǐ jiā yǒu jǐ ge rén?'],
['missing','我家有五 □ 人。','我家有五____人。','個','我家有五個人。','Wǒ jiā yǒu wǔ ge rén.'],
['missing','我家有 □□、媽媽和我。','我家有____、媽媽和我。','爸爸','我家有爸爸、媽媽和我。','Wǒ jiā yǒu bàba, māma hé wǒ.'],
['missing','我家有爸爸、□□和我。','我家有爸爸、____和我。','媽媽','我家有爸爸、媽媽和我。','Wǒ jiā yǒu bàba, māma hé wǒ.'],
['missing','□ 叫小美。','____叫小美。','她','她叫小美。','Tā jiào Xiǎoměi.'],
['missing','你的爸爸叫什麼 □□？','你的爸爸叫什麼____？','名字','你的爸爸叫什麼名字？','Nǐ de bàba jiào shénme míngzi?'],
// Intruder: 8
['intruder','你家<span class="wrong">好</span>有幾個人？','找出多餘的字','好','你家有幾個人？','Nǐ jiā yǒu jǐ ge rén?'],
['intruder','我的<span class="wrong">家</span>名字叫小明。','找出多餘的字','家','我的名字叫小明。','Wǒ de míngzi jiào Xiǎomíng.'],
['intruder','你叫<span class="wrong">我</span>什麼名字？','找出多餘的字','我','你叫什麼名字？','Nǐ jiào shénme míngzi?'],
['intruder','我家有<span class="wrong">叫</span>五個人。','找出多餘的字','叫','我家有五個人。','Wǒ jiā yǒu wǔ ge rén.'],
['intruder','他<span class="wrong">有</span>叫小明。','找出多餘的字','有','他叫小明。','Tā jiào Xiǎomíng.'],
['intruder','你的爸爸<span class="wrong">家</span>叫什麼名字？','找出多餘的字','家','你的爸爸叫什麼名字？','Nǐ de bàba jiào shénme míngzi?'],
['intruder','我家有爸爸、媽媽<span class="wrong">名字</span>和我。','找出多餘的字','名字','我家有爸爸、媽媽和我。','Wǒ jiā yǒu bàba, māma hé wǒ.'],
['intruder','你的名字叫<span class="wrong">家</span>什麼？','找出多餘的字','家','你的名字叫什麼？','Nǐ de míngzi jiào shénme?'],
// Scramble: 7
['scramble','你 ／ 叫 ／ 什麼 ／ 名字 ／ ？','依照正確順序念出整句','—','你叫什麼名字？','Nǐ jiào shénme míngzi?'],
['scramble','有 ／ 我家 ／ 五 ／ 個人 ／ 。','依照正確順序念出整句','—','我家有五個人。','Wǒ jiā yǒu wǔ ge rén.'],
['scramble','幾個人 ／ 你家 ／ 有 ／ ？','依照正確順序念出整句','—','你家有幾個人？','Nǐ jiā yǒu jǐ ge rén?'],
['scramble','小明 ／ 我 ／ 叫 ／ 。','依照正確順序念出整句','—','我叫小明。','Wǒ jiào Xiǎomíng.'],
['scramble','名字 ／ 你的 ／ 叫 ／ 什麼 ／ ？','依照正確順序念出整句','—','你的名字叫什麼？','Nǐ de míngzi jiào shénme?'],
['scramble','我 ／ 爸爸 ／ 和 ／ 有 ／ 媽媽 ／ 我家 ／ 。','依照正確順序念出整句','—','我家有爸爸、媽媽和我。','Wǒ jiā yǒu bàba, māma hé wǒ.'],
['scramble','叫 ／ 她 ／ 小美 ／ 。','依照正確順序念出整句','—','她叫小美。','Tā jiào Xiǎoměi.'],
// Repair: 7
['repair','我家有五人個。','調整字的順序','「人」「個」順序相反','我家有五個人。','Wǒ jiā yǒu wǔ ge rén.'],
['repair','你名字叫什麼的？','把字放回正確位置','「的」應該放在「你」後面','你的名字叫什麼？','Nǐ de míngzi jiào shénme?'],
['repair','你叫名字什麼？','把字放回正確位置','「名字」「什麼」順序相反','你叫什麼名字？','Nǐ jiào shénme míngzi?'],
['repair','我名字叫的安安。','把字放回正確位置','「的」應該放在「我」後面','我的名字叫安安。','Wǒ de míngzi jiào Ān’ān.'],
['repair','你家有個幾人？','把字放回正確位置','「幾」「個」順序相反','你家有幾個人？','Nǐ jiā yǒu jǐ ge rén?'],
['repair','他小明叫。','把字放回正確位置','「叫」應該放在名字前面','他叫小明。','Tā jiào Xiǎomíng.'],
['repair','我的爸爸名字叫什麼？','把字放回正確位置','把「名字」放到句尾','我的爸爸叫什麼名字？','Wǒ de bàba jiào shénme míngzi?'],
// Q&A: 6
['qa','你叫什麼名字？','請用完整句子回答','例：我叫小明。','答案依學生自己的名字而定',''],
['qa','你的名字叫什麼？','請用完整句子回答','例：我的名字叫小美。','答案依學生自己的名字而定',''],
['qa','你家有幾個人？','請用完整句子回答','例：我家有五個人。','答案依學生的家庭而定',''],
['qa','你的爸爸叫什麼名字？','請用完整句子回答','例：我的爸爸叫……','答案依學生的家庭而定',''],
['qa','你家有誰？','試著說出家人','例：我家有爸爸、媽媽和我。','答案依學生的家庭而定',''],
['qa','你有哥哥、姊姊、弟弟或妹妹嗎？','請試著回答','例：我有一個妹妹。／我沒有。','答案依學生的家庭而定',''],
// Magic: 7
['magic','我家有<span class="change">三</span>個人。','把「三」換成「五」','三 → 五','我家有五個人。','Wǒ jiā yǒu wǔ ge rén.'],
['magic','我叫<span class="change">小明</span>。','把「小明」換成「小美」','小明 → 小美','我叫小美。','Wǒ jiào Xiǎoměi.'],
['magic','<span class="change">他</span>叫小明。','把「他」換成「她」','他 → 她','她叫小明。','Tā jiào Xiǎomíng.'],
['magic','我家有<span class="change">五</span>個人。','把「五」換成「三」','五 → 三','我家有三個人。','Wǒ jiā yǒu sān ge rén.'],
['magic','我的<span class="change">媽媽</span>叫小美。','把「媽媽」換成「姊姊」','媽媽 → 姊姊','我的姊姊叫小美。','Wǒ de jiějie jiào Xiǎoměi.'],
['magic','<span class="change">你</span>叫什麼名字？','把「你」換成「他」','你 → 他','他叫什麼名字？','Tā jiào shénme míngzi?'],
['magic','我家有爸爸、<span class="change">媽媽</span>和我。','把「媽媽」換成「哥哥」','媽媽 → 哥哥','我家有爸爸、哥哥和我。','Wǒ jiā yǒu bàba, gēge hé wǒ.']
];
// 數字朗讀使用 10 個動態題位：混合模式能定期抽到，單獨模式可持續練習。
for(let i=0;i<10;i++)Q.push(['numbers']);
const digitWords=['零','一','二','三','四','五','六','七','八','九'];
function numberToChinese(n){if(!Number.isInteger(n)||n<11||n>99)throw Error('數字超出題庫範圍');const tens=Math.floor(n/10),ones=n%10;return (tens===1?'十':digitWords[tens]+'十')+(ones?digitWords[ones]:'')}
function newNumberRound(){const nums=new Set();while(nums.size<4)nums.add(11+Math.floor(Math.random()*89));return [...nums]}
const TITLES={missing:'🧩 消失的字',intruder:'🕵️ 抓出搗蛋鬼',scramble:'🌪️ 句子大風吹',repair:'🔧 句子修理工',qa:'🎤 神祕問答',magic:'✨ 句子變魔術',numbers:'🔢 數字朗讀'};
const INSTR={missing:'缺少哪一個字？',intruder:'找出多餘的字，然後念出正確句子！',scramble:'這些字詞要怎麼排？',repair:'哪個地方放錯了？',qa:'請大聲回答！',magic:'念出變化後的句子！',numbers:'請依序用中文念出這四個數字！'};
const INSTR_EN={missing:'Find the missing character!',intruder:'Find the extra character and say the correct sentence!',scramble:'Put the words in the right order!',repair:'Fix the word order!',qa:'Answer out loud in a full sentence!',magic:'Change the highlighted word and say the new sentence!',numbers:'Read all four numbers aloud in Mandarin!'};
const $=id=>document.getElementById(id);let deck=[],history=[],numberRounds=[],cursor=-1,show=false,pinyin=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){const mode=$('mode').value;deck=shuffle(Q.map((q,i)=>i).filter(i=>mode==='all'||Q[i][0]===mode));history=[];numberRounds=[];cursor=-1;next()}
function render(){let q=Q[history[cursor]],type=q[0];if(type==='numbers'){const nums=numberRounds[cursor];if(!nums||nums.length!==4)throw Error('數字題目未初始化');$('kind').textContent=TITLES[type];$('instruction').textContent=INSTR[type];$('instructionEn').textContent=INSTR_EN[type];$('prompt').innerHTML='<div class="number-grid'+(show?' revealed':'')+'">'+nums.map(n=>'<div class="number-tile"><span class="number-value">'+n+'</span><span class="number-reading">'+numberToChinese(n)+'</span></div>').join('')+'</div>';$('questionPinyin').classList.add('hidden');$('answer').classList.add('hidden');document.querySelector('.stage').classList.toggle('revealed',show);$('reveal').textContent=show?'🙈 隱藏答案':'👀 顯示答案';$('progress').textContent=`本輪第 ${cursor+1} / ${deck.length} 題 · 六種句型題＋數字朗讀`;$('back').disabled=cursor<=0;return}$('kind').textContent=TITLES[type];$('instruction').textContent=INSTR[type];$('instructionEn').textContent=INSTR_EN[type];$('prompt').innerHTML=q[1];$('questionPinyin').classList.add('hidden');$('answer').classList.toggle('hidden',!show);document.querySelector('.stage').classList.toggle('revealed',show);$('explain').textContent=(type==='missing'||type==='intruder')?'關鍵字：'+q[3]:q[3]==='—'?'正確句子：':q[3];$('correct').textContent=q[4];$('answerPinyin').textContent=q[5];$('answerPinyin').classList.toggle('hidden',!pinyin||!show||!q[5]);$('reveal').textContent=show?'🙈 隱藏答案':'👀 顯示答案';$('progress').textContent=`本輪第 ${cursor+1} / ${deck.length} 題 · 共 ${Q.length} 題題庫`; $('back').disabled=cursor<=0}
function next(){if(cursor<history.length-1){cursor++;show=false;render();return}if(history.length>=deck.length){let old=history[cursor];deck=shuffle(deck);if(deck.length>1&&deck[0]===old){[deck[0],deck[1]]=[deck[1],deck[0]]}history=[];numberRounds=[];cursor=-1;notify('已完成本輪，開始新一輪！')}const questionIndex=deck[history.length];history.push(questionIndex);numberRounds.push(Q[questionIndex][0]==='numbers'?newNumberRound():null);cursor++;show=false;render()}
function notify(msg){let el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>el.classList.remove('show'),1800)}
$('mode').addEventListener('change',makeDeck);$('next').addEventListener('click',next);$('reveal').addEventListener('click',()=>{show=!show;render()});$('back').addEventListener('click',()=>{if(cursor>0){cursor--;show=false;render()}});$('reset').addEventListener('click',()=>{makeDeck();notify('題目已重新洗牌')});$('pinyin').addEventListener('click',()=>{pinyin=!pinyin;$('pinyin').setAttribute('aria-pressed',String(pinyin));$('pinyin').textContent='拼音：'+(pinyin?'開':'關');render()});$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{notify('iPhone Safari 不支援此全螢幕功能，可使用加入主畫面')}}catch{notify('目前瀏覽器無法進入全螢幕')}});
window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();show=!show;render()}if(e.code==='ArrowRight')next();if(e.code==='ArrowLeft'&&cursor>0){cursor--;show=false;render()}});
makeDeck();
</script></body></html>
